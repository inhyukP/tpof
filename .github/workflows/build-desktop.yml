name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/replace-streamlit-flask

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: TPOF-windows
            path: dist/TPOF-windows.zip
          - name: macOS
            os: macos-latest
            artifact: TPOF-mac
            path: dist/TPOF-mac.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build app
        run: python build_desktop.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
